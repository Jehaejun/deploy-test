apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: spring-app
          image: jhjun07/spring-k8s-demo:62fcbe6a46780fa0c049effcf69da2d0fcc22943
          ports:
            - containerPort: 8080
          imagePullPolicy: Always