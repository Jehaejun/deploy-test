name: CI (develop) - Build, Push Image, Update Kustomize

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: write

concurrency:
  group: develop-cicd
  cancel-in-progress: true

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon
          ls -al build/libs

      # push 이벤트에서만 실행 (PR에서는 skip)
      - name: Set image metadata
        if: github.event_name == 'push'
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPO=jhjun07/spring-k8s-demo" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image (SHA tag only)
        if: github.event_name == 'push'
        run: |
          docker build -t ${IMAGE_REPO}:${IMAGE_TAG} .
          docker push ${IMAGE_REPO}:${IMAGE_TAG}

      - name: Update Kustomize image tag (develop overlay) and push commit
        if: github.event_name == 'push'
        run: |
          FILE="k8s/overlays/develop/kustomization.yaml"
          sed -i "0,/newTag:/s/newTag:.*/newTag: ${IMAGE_TAG}/" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add "$FILE"
          git commit -m "chore: dev deploy ${IMAGE_TAG}" || echo "No changes to commit"
          git push