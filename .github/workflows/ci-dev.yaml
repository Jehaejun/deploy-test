name: CI - Build & Push Docker Image (Gradle + Docker Hub)

on:
  push:
    branches: [ "main", "develop" ]   # 원하는 브랜치로 조정
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest   # GitHub 호스티드 러너 사용

    steps:
      # 1) 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) JDK 설정 (프로젝트 버전에 맞게 수정)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'           # 17/11 등 사용 중인 버전으로 변경 가능
          distribution: 'temurin'
          cache: 'gradle'

      # 3) Gradle 빌드
      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

      # 4) Docker 이미지/태그 설정 (커밋 SHA 기반)
      - name: Set image metadata
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }}/spring-k8s-demo" >> $GITHUB_ENV

      # 5) Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6) Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -t ${IMAGE_REPO}:${IMAGE_TAG} \
            -t ${IMAGE_REPO}:latest \
            .

      # 7) Docker Hub로 푸시
      - name: Push Docker image
        run: |
          docker push ${IMAGE_REPO}:${IMAGE_TAG}
          docker push ${IMAGE_REPO}:latest

      # 8) (옵션) 빌드 산출물(JAR) 아티팩트로 보관
      #- name: Upload build artifact
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: spring-boot-jar
      #    path: build/libs/*.jar를

      - name: Update Kustomize image tag for dev
        run: |
          sed -i "s/newTag:.*/newTag: ${IMAGE_TAG}/" ${KUSTOMIZE_PATH}/kustomization.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add ${KUSTOMIZE_PATH}/kustomization.yaml
          git commit -m "chore: dev deploy ${IMAGE_TAG}" || echo "No changes to commit"
          git push
