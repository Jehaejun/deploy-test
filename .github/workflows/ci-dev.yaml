name: CI (develop) - Build & Push Docker Image + Update Kustomize Tag

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: write

concurrency:
  group: develop-kustomize-tag
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

  push-and-update:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set image metadata
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPO=jhjun07/spring-k8s-demo" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image (SHA tag only)
        run: |
          docker build -t ${IMAGE_REPO}:${IMAGE_TAG} .
          docker push ${IMAGE_REPO}:${IMAGE_TAG}

      - name: Update Kustomize image tag (develop overlay)
        run: |
          FILE="k8s/overlays/develop/kustomization.yaml"

          # 첫 번째 newTag만 교체
          sed -i "0,/newTag:/s/newTag:.*/newTag: ${IMAGE_TAG}/" "${FILE}"

          echo "KUSTOMIZE_FILE=${FILE}" >> $GITHUB_ENV
          echo "COMMIT_MSG=chore: dev deploy ${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Commit & Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          git add "${KUSTOMIZE_FILE}"
          git commit -m "${COMMIT_MSG}" || echo "No changes to commit"
          git push