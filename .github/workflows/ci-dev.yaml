name: CI (develop) - Build & Push Docker Image + Update Kustomize Tag

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: write

concurrency:
  group: develop-kustomize-tag
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew clean build --no-daemon

  push-and-update:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 🔥 여기 추가: 이 job에서도 jar를 만들어야 docker build 컨텍스트에 생김
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - run: chmod +x ./gradlew
      - run: ./gradlew clean build --no-daemon
      - run: ls -al build/libs

      - name: Set image metadata
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPO=jhjun07/spring-k8s-demo" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image (SHA tag only)
        run: |
          docker build -t ${IMAGE_REPO}:${IMAGE_TAG} .
          docker push ${IMAGE_REPO}:${IMAGE_TAG}

      - name: Update Kustomize image tag (develop overlay)
        run: |
          FILE="k8s/overlays/develop/kustomization.yaml"
          sed -i "0,/newTag:/s/newTag:.*/newTag: ${IMAGE_TAG}/" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add "$FILE"
          git commit -m "chore: dev deploy ${IMAGE_TAG}" || echo "No changes to commit"
          git push